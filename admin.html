<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — PrePortal</title>
  <meta name="description" content="PrePortal admin panel: posts, categories, authors, appearance, ads and site settings.">
  <meta name="theme-color" content="#0a1225">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/css/theme.css?v=3">
  <script>
    (function () {
      try {
        var m = localStorage.getItem('preportal:theme') || 'dark';
        var r = m === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : m;
        document.documentElement.setAttribute('data-theme', r === 'light' ? 'light' : 'dark');
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="admin">

  <header class="site-header" data-header></header>

  <main class="admin">
    <div class="container admin-shell">

      <aside class="admin-nav" aria-label="Admin">
        <div class="admin-nav__head">
          <span class="eyebrow" data-i18n="admin.brand"></span>
        </div>
        <nav id="adminNav" class="admin-nav__list"></nav>
        <div class="admin-nav__foot">
          <a class="btn btn--primary btn--sm" href="create.html"><span data-i18n="admin.newPost"></span></a>
        </div>
      </aside>

      <div class="admin-body">
        <div class="admin-head">
          <div>
            <h1 id="adminTitle" style="font-size:clamp(1.4rem,1.1rem+1vw,1.9rem);margin:0"></h1>
            <p id="adminLead" class="muted" style="margin:6px 0 0;max-width:70ch;font-size:.9rem"></p>
          </div>
          <span class="pill" id="adminBadge"></span>
        </div>

        <div class="admin-section" data-panel="overview" id="panelOverview"></div>
        <div class="admin-section" data-panel="posts" id="panelPosts" hidden></div>
        <div class="admin-section" data-panel="categories" id="panelCategories" hidden></div>
        <div class="admin-section" data-panel="users" id="panelUsers" hidden></div>
        <div class="admin-section" data-panel="appearanceAds" id="panelAppearanceAds" hidden></div>
        <div class="admin-section" data-panel="settings" id="panelSettings" hidden></div>
        <div class="admin-section" data-panel="security" id="panelSecurity" hidden></div>
      </div>
    </div>
  </main>

  <footer class="site-footer" data-footer></footer>

  <script src="data/config.js?v=2"></script>
  <script src="assets/js/cache-bust.js?v=1"></script>
  <script src="data/runtime.js?v=1"></script>
  <script src="assets/js/i18n.js?v=1"></script>
  <script src="assets/js/engine.js?v=5"></script>
  <script src="assets/js/core.js?v=3"></script>
  <script src="assets/js/publisher.js?v=1"></script>
  <script src="assets/js/admin.js?v=2"></script>
  <script>
    window.PrePortal.ready();
  </script>
</body>
</html>
