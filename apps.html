<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apps — PrePortal</title>
  <meta name="description" content="APK and app reviews, version notes and download links.">
  <meta name="theme-color" content="#0a1225">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PrePortal">
  <meta property="og:title" content="Apps — PrePortal">
  <meta property="og:description" content="APK and app reviews, version notes and download links.">
  <meta property="og:image" content="assets/img/logo-256.png">
  <link rel="stylesheet" href="assets/css/theme.css?v=3">
  <script>
    (function () {
      try {
        var m = localStorage.getItem('preportal:theme') || 'dark';
        var r = m === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : m;
        document.documentElement.setAttribute('data-theme', r === 'light' ? 'light' : 'dark');
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="apps">

  <header class="site-header" data-header></header>

  <div class="container"><div class="ad-slot" data-ad="header" hidden></div></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow" data-i18n="catalog.appsEyebrow"></span>
        <h1 data-i18n="catalog.appsTitle"></h1>
        <p data-i18n="catalog.appsLead"></p>
      </div>
    </section>
    <section class="section" style="padding-top:16px">
      <div class="container">
        <div class="grid grid--posts" id="archiveGrid" data-fixed-cat="apps"></div>
      </div>
    </section>
  </main>

  <div class="container"><div class="ad-slot" data-ad="footer" hidden></div></div>

  <footer class="site-footer" data-footer></footer>

  <script src="data/config.js?v=2"></script>
  <script src="assets/js/cache-bust.js?v=1"></script>
  <script src="data/runtime.js?v=1"></script>
  <script src="assets/js/i18n.js?v=1"></script>
  <script src="assets/js/engine.js?v=5"></script>
  <script src="assets/js/core.js?v=3"></script>
  <script src="assets/js/archive.js?v=1"></script>
  <script>
    window.PrePortal.ready();
  </script>
</body>
</html>
