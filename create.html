<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create a post — PrePortal</title>
  <meta name="description" content="PrePortal publishing studio: write with CKEditor 5 and export a ready-to-publish JavaScript file.">
  <meta name="theme-color" content="#070b18">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PrePortal">
  <meta property="og:title" content="Create a post — PrePortal">
  <meta property="og:description" content="Write with CKEditor 5 and export a ready-to-publish file.">
  <meta property="og:image" content="assets/img/logo-256.png">
  <link rel="stylesheet" href="vendor/ckeditor5/ckeditor5.css">
  <link rel="stylesheet" href="assets/css/theme.css"?v=1>
  <script>
    (function () {
      try {
        var m = localStorage.getItem('preportal:theme') || 'dark';
        var r = m === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : m;
        document.documentElement.setAttribute('data-theme', r === 'light' ? 'light' : 'dark');
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="create">

  <header class="site-header" data-header></header>

  <main class="studio">
    <div class="container">
      <div class="section-head" style="margin-bottom:18px">
        <div>
          <span class="eyebrow" data-i18n="studio.eyebrow"></span>
          <h1 style="font-size:clamp(1.6rem,1.2rem+1.4vw,2.2rem);margin:0" data-i18n="studio.title"></h1>
          <p data-i18n="studio.lead"></p>
        </div>
      </div>

      <div id="editorRoot"></div>
    </div>
  </main>

  <footer class="site-footer" data-footer></footer>

  <script src="data/config.js?v=1"></script>
  <script src="assets/js/cache-bust.js?v=1"></script>
  <script src="data/runtime.js?v=1"></script>
  <script src="assets/js/i18n.js?v=1"></script>
  <script src="assets/js/engine.js?v=5"></script>
  <script src="assets/js/core.js?v=1"></script>
  <script src="assets/js/publisher.js?v=1"></script>
  <script src="vendor/ckeditor5/translations/tr.umd.js"></script>
  <script src="vendor/ckeditor5/translations/i18n-extra.js"></script>
  <script src="vendor/ckeditor5/ckeditor5.umd.js"></script>
  <script src="assets/js/create.js?v=1"></script>
  <script>
    window.PrePortal.ready();
  </script>
</body>
</html>
