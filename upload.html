<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media — PrePortal</title>
  <meta name="description" content="Compress and convert images to WebP in the browser.">
  <meta name="theme-color" content="#0a1225">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PrePortal">
  <meta property="og:title" content="Media — PrePortal">
  <meta property="og:description" content="Compress and convert images to WebP in the browser.">
  <meta property="og:image" content="assets/img/logo-256.png">
  <link rel="stylesheet" href="assets/css/theme.css?v=3">
  <script>
    (function () {
      try {
        var m = localStorage.getItem('preportal:theme') || 'dark';
        var r = m === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : m;
        document.documentElement.setAttribute('data-theme', r === 'light' ? 'light' : 'dark');
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="upload">

  <header class="site-header" data-header></header>

  <main class="studio">
    <div class="container">
      <div class="section-head" style="margin-bottom:18px">
        <div>
          <span class="eyebrow" data-i18n="media.eyebrow"></span>
          <h1 style="font-size:clamp(1.6rem,1.2rem+1.4vw,2.2rem);margin:0" data-i18n="media.title"></h1>
          <p data-i18n="media.lead"></p>
        </div>
      </div>

      <div class="grid grid--sidebar">
        <div>
          <div class="panel">
            <label class="upload-drop" id="dropZone" for="fileInput">
              <span class="upload-drop__icon"></span>
              <strong data-i18n="media.dropTitle"></strong>
              <small data-i18n="media.dropHint"></small>
              <input type="file" id="fileInput" accept="image/*" multiple hidden>
            </label>

            <div class="form-grid" style="grid-template-columns:1fr 1fr;margin-top:18px">
              <div class="form-row">
                <label class="label" for="optWidth" data-i18n="media.maxWidth"></label>
                <input class="input" id="optWidth" type="number" value="1280" min="120" max="4000">
              </div>
              <div class="form-row">
                <label class="label" for="optQuality" data-i18n="media.quality"></label>
                <input class="input" id="optQuality" type="number" value="82" min="30" max="100">
              </div>
            </div>
          </div>

          <div id="uploadResults" style="margin-top:18px;display:flex;flex-direction:column;gap:12px"></div>
        </div>

        <aside class="sidebar">
          <div class="panel">
            <h4 data-i18n="media.copyPath"></h4>
            <p class="muted" style="font-size:.86rem;margin:0 0 10px" data-i18n="media.pathHint"></p>
            <span class="file-pill">assets/img/file-name.webp</span>
          </div>
          <div class="panel">
            <h4 data-i18n="media.tips"></h4>
            <ul class="cat-list" style="gap:8px">
              <li><span class="muted" style="font-size:.84rem" data-i18n="media.tip1"></span></li>
              <li><span class="muted" style="font-size:.84rem" data-i18n="media.tip2"></span></li>
              <li><span class="muted" style="font-size:.84rem" data-i18n="media.tip3"></span></li>
            </ul>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <div class="container"><div class="ad-slot" data-ad="footer" hidden></div></div>

  <footer class="site-footer" data-footer></footer>

  <script src="data/config.js?v=2"></script>
  <script src="assets/js/cache-bust.js?v=1"></script>
  <script src="data/runtime.js?v=1"></script>
  <script src="assets/js/i18n.js?v=1"></script>
  <script src="assets/js/engine.js?v=5"></script>
  <script src="assets/js/core.js?v=3"></script>
  <script src="assets/js/upload.js?v=1"></script>
  <script>
    window.PrePortal.ready();
  </script>
</body>
</html>
