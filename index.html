<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrePortal — Apps, games and software archive</title>
  <meta name="description" content="PrePortal — APK, game and software reviews, guides and release notes.">
  <meta name="theme-color" content="#0a1225">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PrePortal">
  <meta property="og:title" content="PrePortal — Apps, games and software archive">
  <meta property="og:description" content="APK, game and software reviews, guides and release notes.">
  <meta property="og:image" content="assets/img/logo-256.png">
  <link rel="stylesheet" href="assets/css/theme.css?v=3">
  <script>
    /* theme is applied before first paint (no flash) */
    (function () {
      try {
        var m = localStorage.getItem('preportal:theme') || 'dark';
        var r = m === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : m;
        document.documentElement.setAttribute('data-theme', r === 'light' ? 'light' : 'dark');
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="index">

  <header class="site-header" data-header></header>

  <div class="container"><div class="ad-slot" data-ad="header" hidden></div></div>

  <main>
    <section class="journal-hero container">
      <div class="journal-hero__copy">
        <p class="journal-kicker" data-i18n="home.eyebrow">Reviews · Guides · Release notes</p>
        <h1 data-i18n="home.title">Apps &amp; games, all in one place</h1>
        <p class="journal-hero__lead" data-i18n="home.lead">Reviews, guides and release notes.</p>
        <div class="journal-hero__actions">
          <a class="btn btn--primary" href="#latest" data-i18n="home.ctaExplore">Browse the catalog</a>
          <a class="journal-text-link" href="about.html" data-i18n="footer.about">About</a>
        </div>
      </div>
      <div class="journal-hero__art" aria-hidden="true">
        <svg class="journal-fragments" viewBox="0 0 600 420" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
          <g fill="#3C80FD">
            <path opacity=".14" d="M0 0H260L0 260Z"/>
            <path opacity=".38" d="M0 56 165 0H255L70 180Z"/>
            <path opacity=".8" d="M0 180 70 180 0 295Z"/>
            <path opacity=".17" d="M600 45 420 205 600 260Z"/>
            <path opacity=".55" d="M600 180 440 310 600 345Z"/>
            <path opacity=".95" d="M470 420 600 285V420Z"/>
            <path opacity=".23" d="M205 420 350 310 420 420Z"/>
          </g>
          <g fill="none" stroke="#FEFEFE" stroke-opacity=".16">
            <path d="M0 56 255 0 70 180 0 295M420 205 600 45M350 310 600 345M205 420 600 180"/>
            <path d="M300 0V420M0 210H600" stroke-dasharray="3 9"/>
            <path d="M300 30 455 120V300L300 390 145 300V120Z"/>
            <path d="M300 48 439 129V291L300 372 161 291V129Z"/>
          </g>
        </svg>
        <img class="journal-emblem" src="assets/img/logo.svg" alt="" width="240" height="240">
        <span class="journal-art-label">PREPORTAL / 001</span>
      </div>
      <div class="journal-hero__foot">
        <span data-i18n="brand.tagline">Apps, games &amp; software archive</span>
        <a href="#latest"><span data-i18n="home.latestTitle">Latest additions</span> ↓</a>
      </div>
    </section>

    <!-- CATALOG TOOLBAR -->
    <section class="catalog-top">
      <div class="container catalog-top__inner">
        <nav class="cat-tabs" id="homeCatTabs" aria-label="Categories">
          <a class="cat-tab is-active" href="index.html" data-cat="">
            <span data-i18n="catalog.filterAll"></span>
            <small id="countAll">0</small>
          </a>
        </nav>

        <div class="catalog-tools">
          <label class="field">
            <span class="sr-only" data-i18n="actions.search"></span>
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input class="input" type="search" id="homeSearch" autocomplete="off" data-i18n-attr="placeholder:catalog.searchPlaceholder">
          </label>
          <div class="select-wrap">
            <label class="sr-only" for="homeSort" data-i18n="catalog.sortNew"></label>
            <select class="select" id="homeSort">
              <option value="new" data-i18n="catalog.sortNew"></option>
              <option value="old" data-i18n="catalog.sortOld"></option>
              <option value="az" data-i18n="catalog.sortAz"></option>
              <option value="za" data-i18n="catalog.sortZa"></option>
              <option value="read" data-i18n="catalog.sortRead"></option>
            </select>
          </div>
          <a class="btn btn--primary btn--sm" href="create.html">
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            <span data-i18n="actions.write"></span>
          </a>
        </div>
      </div>
    </section>

    <!-- CATALOG GRID -->
    <section class="section catalog-section" id="latest">
      <div class="container journal-columns">
        <div class="journal-feed">
        <div class="catalog-head">
          <div>
            <h2 id="homeTitle" class="catalog-head__title">Latest posts</h2>
            <p id="homeSub" class="catalog-head__sub">Newest reviews, guides and release notes.</p>
          </div>
          <span class="catalog-head__count" id="homeCount" aria-live="polite"></span>
        </div>

        <div class="grid grid--posts" id="homePosts" aria-live="polite">
          <div class="skeleton" style="height:290px"></div>
          <div class="skeleton" style="height:290px"></div>
          <div class="skeleton" style="height:290px"></div>
          <div class="skeleton" style="height:290px"></div>
        </div>
        <div id="homePager" class="catalog-pager"></div>
        </div>
        <aside class="journal-sidebar" aria-label="PrePortal">
          <section class="journal-about">
            <p class="journal-kicker" data-i18n="footer.about">About</p>
            <h2>PrePortal</h2>
            <p data-i18n="home.latestSub"></p>
            <a class="journal-text-link" href="about.html" data-i18n="footer.about">About</a>
          </section>
          <section class="journal-side-panel">
            <span class="eyebrow" data-i18n="categories.eyebrow"></span><h2 data-i18n="home.categoriesTitle"></h2>
            <div class="grid" id="homeCategories"></div>
            <a class="journal-text-link" href="category.html" data-i18n="nav.categories"></a>
          </section>
          <section class="journal-side-panel">
            <h2 data-i18n="home.latestTitle"></h2>
            <div id="journalRecent"></div>
            <a class="journal-text-link" href="blog.html" data-i18n="actions.seeAll"></a>
          </section>
        </aside>
      </div>
    </section>

  </main>

  <div class="container"><div class="ad-slot" data-ad="footer" hidden></div></div>

  <footer class="site-footer" data-footer></footer>

  <script src="data/config.js?v=2"></script>
  <script src="assets/js/cache-bust.js?v=1"></script>
  <script src="data/runtime.js?v=1"></script>
  <script src="assets/js/i18n.js?v=1"></script>
  <script src="assets/js/engine.js?v=5"></script>
  <script src="assets/js/core.js?v=3"></script>
  <script src="assets/js/home.js?v=2"></script>
  <script>
    window.PrePortal.ready();
  </script>
</body>
</html>
