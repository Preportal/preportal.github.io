<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrePortal — Apps, games and software archive</title>
  <meta name="description" content="PrePortal — APK, game and software reviews, guides and release notes.">
  <meta name="theme-color" content="#070b18">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PrePortal">
  <meta property="og:title" content="PrePortal — Apps, games and software archive">
  <meta property="og:description" content="APK, game and software reviews, guides and release notes.">
  <meta property="og:image" content="assets/img/logo-256.png">
  <link rel="stylesheet" href="assets/css/theme.css"?v=1>
  <script>
    /* theme is applied before first paint (no flash) */
    (function () {
      try {
        var m = localStorage.getItem('preportal:theme') || 'dark';
        var r = m === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : m;
        document.documentElement.setAttribute('data-theme', r === 'light' ? 'light' : 'dark');
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="index">

  <header class="site-header" data-header></header>

  <div class="container"><div class="ad-slot" data-ad="header" hidden></div></div>

  <main>
    <!-- CATALOG TOOLBAR -->
    <section class="catalog-top">
      <div class="container catalog-top__inner">
        <nav class="cat-tabs" id="homeCatTabs" aria-label="Categories">
          <a class="cat-tab is-active" href="index.html" data-cat="">
            <span data-i18n="catalog.filterAll"></span>
            <small id="countAll">0</small>
          </a>
        </nav>

        <div class="catalog-tools">
          <label class="field">
            <span class="sr-only" data-i18n="actions.search"></span>
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input class="input" type="search" id="homeSearch" autocomplete="off" data-i18n-attr="placeholder:catalog.searchPlaceholder">
          </label>
          <div class="select-wrap">
            <label class="sr-only" for="homeSort" data-i18n="catalog.sortNew"></label>
            <select class="select" id="homeSort">
              <option value="new" data-i18n="catalog.sortNew"></option>
              <option value="old" data-i18n="catalog.sortOld"></option>
              <option value="az" data-i18n="catalog.sortAz"></option>
              <option value="za" data-i18n="catalog.sortZa"></option>
              <option value="read" data-i18n="catalog.sortRead"></option>
            </select>
          </div>
          <a class="btn btn--primary btn--sm" href="create.html">
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            <span data-i18n="actions.write"></span>
          </a>
        </div>
      </div>
    </section>

    <!-- CATALOG GRID -->
    <section class="section catalog-section">
      <div class="container">
        <div class="catalog-head">
          <div>
            <h1 id="homeTitle" class="catalog-head__title">Latest posts</h1>
            <p id="homeSub" class="catalog-head__sub">Newest reviews, guides and release notes.</p>
          </div>
          <span class="catalog-head__count" id="homeCount" aria-live="polite"></span>
        </div>
        <div class="grid grid--posts" id="homePosts" aria-live="polite">
          <div class="skeleton" style="height:290px"></div>
          <div class="skeleton" style="height:290px"></div>
          <div class="skeleton" style="height:290px"></div>
          <div class="skeleton" style="height:290px"></div>
        </div>
        <div id="homePager" class="catalog-pager"></div>
      </div>
    </section>

    <!-- CATEGORY STRIP -->
    <section class="section section--tight">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow" data-i18n="categories.eyebrow"></span>
            <h2 data-i18n="home.categoriesTitle"></h2>
          </div>
          <a class="btn btn--ghost btn--sm" href="category.html" data-i18n="nav.categories"></a>
        </div>
        <div class="grid grid--3" id="homeCategories"></div>
      </div>
    </section>
  </main>

  <div class="container"><div class="ad-slot" data-ad="footer" hidden></div></div>

  <footer class="site-footer" data-footer></footer>

  <script src="data/config.js?v=1"></script>
  <script src="assets/js/cache-bust.js?v=1"></script>
  <script src="data/runtime.js?v=1"></script>
  <script src="assets/js/i18n.js?v=1"></script>
  <script src="assets/js/engine.js?v=5"></script>
  <script src="assets/js/core.js?v=1"></script>
  <script src="assets/js/home.js?v=1"></script>
  <script>
    window.PrePortal.ready();
  </script>
</body>
</html>
